[project]
name = "defenx-cloudflare"
version = "0.1.0"
description = "DEFENX Flask application running on Cloudflare Workers"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0,<4.0",
    "pg8000>=1.31,<2.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "cryptography>=44,<47",
]
