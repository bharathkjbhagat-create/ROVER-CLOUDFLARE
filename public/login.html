<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030914"><title>DEFENX | Login</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Inter,"Segoe UI",Arial,sans-serif;background:#030914;color:#f4f7ff}
body{min-height:100vh;min-height:100dvh;overflow:hidden}
.scene{position:relative;width:100%;min-height:100vh;min-height:100dvh;background:#030914 url("/defenx-login-bg.png") center center/cover no-repeat;display:flex;align-items:center;justify-content:flex-end;padding:7vh 13.2vw 10vh 4vw}
.scene:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 42%,rgba(1,7,17,.12) 56%,rgba(1,7,17,.3) 100%)}
.panel{position:relative;z-index:1;width:min(500px,40vw);min-width:390px;padding:48px 44px 32px;background:linear-gradient(145deg,rgba(4,12,28,.94),rgba(2,9,22,.97));border:1px solid rgba(91,174,238,.72);border-radius:20px;box-shadow:0 0 0 1px rgba(255,255,255,.07) inset,0 0 26px rgba(0,156,255,.28),0 0 26px rgba(255,30,55,.16);clip-path:polygon(0 22px,22px 0,calc(100% - 22px) 0,100% 22px,100% calc(100% - 22px),calc(100% - 22px) 100%,22px 100%,0 calc(100% - 22px))}
.panel:before{content:"";position:absolute;left:0;top:0;width:5px;height:74px;background:#ff2438;box-shadow:0 0 18px #ff2438}
.panel:after{content:"";position:absolute;right:0;bottom:0;width:5px;height:74px;background:#24baff;box-shadow:0 0 18px #24baff}
h1{text-align:center;margin:0;font-size:clamp(34px,3vw,48px);font-weight:800;letter-spacing:-1px}
.rule{height:3px;width:82%;margin:12px auto 36px;background:linear-gradient(90deg,transparent,#ff2539 15%,#ff2539 85%,transparent);box-shadow:0 0 12px #ff2438}
.field{position:relative;margin:0 0 17px}
.field input{display:block;width:100%;height:58px;padding:0 18px 0 66px;border:1px solid #536987;border-radius:11px;outline:none;background:linear-gradient(110deg,rgba(17,31,53,.96),rgba(8,17,34,.98));color:#f4f7ff;font-size:16px;box-shadow:inset 0 1px 8px #0006}
.field input::placeholder{color:#d0d8e7;opacity:1}
.field input:focus{border-color:#48baff;box-shadow:0 0 0 3px #1688d233,0 0 18px #1688d244}
.fieldIcon{position:absolute;left:19px;top:50%;transform:translateY(-50%);font-size:22px;color:#e8f2ff;pointer-events:none}
.eye{position:absolute;right:8px;top:8px;width:42px;height:42px;border:0;background:transparent;color:#e3efff;font-size:21px;cursor:pointer}
.error{min-height:18px;margin:4px 0 0;color:#ff8b98;font-size:12px;text-align:center}
.submit{width:100%;height:62px;margin-top:8px;border:1px solid #ff6b70;border-radius:11px;background:linear-gradient(180deg,#ff312d,#e10d16);color:#fff;font-size:22px;font-weight:800;box-shadow:0 0 22px #ff201f66,inset 0 1px #ffffff66;cursor:pointer}
.submit:disabled{opacity:.65;cursor:wait}
.foot{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:28px;padding-top:18px;border-top:1px solid #49627e;color:#d4dfef;font-size:11px;letter-spacing:1.1px}
.shield{font-size:25px;color:#edf6ff}
@media(max-width:760px){body{overflow:auto}.scene{min-height:100dvh;justify-content:center;padding:24px 16px;background-position:38% center}.scene:before{content:"";position:absolute;inset:0;background:rgba(1,6,16,.45)}.panel{width:min(440px,100%);min-width:0;padding:36px 25px 26px;background:rgba(3,10,24,.91)}h1{font-size:36px}.rule{margin-bottom:28px}.field input{height:55px}.submit{height:56px;font-size:19px}.foot{font-size:9px}}
@media(max-width:380px){.panel{padding:30px 18px 22px}.foot{letter-spacing:.5px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="scene">
<section class="panel" aria-label="DEFENX operator login">
<h1>Login</h1><div class="rule"></div>
<form id="form" novalidate>
<div class="field"><span class="fieldIcon" aria-hidden="true">👤</span><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Username or Email" aria-label="Username or Email" required></div>
<div class="field"><span class="fieldIcon" aria-hidden="true">🔒</span><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required><button class="eye" id="eye" type="button" aria-label="Show password" title="Show password">◉</button></div>
<button class="submit" id="submit" type="submit">Login <span aria-hidden="true">→</span></button><div id="error" class="error" role="alert" aria-live="polite"></div>
</form>
<div class="foot"><span class="shield" aria-hidden="true">⛨</span><span>DEFENX v2.0&nbsp; | &nbsp;SECURE&nbsp; • &nbsp;INTELLIGENT&nbsp; • &nbsp;CONNECTED</span></div>
</section>
</main>
<script>
(()=>{"use strict";
const form=document.getElementById("form"),error=document.getElementById("error"),password=document.getElementById("password"),eye=document.getElementById("eye"),submit=document.getElementById("submit");
eye.addEventListener("click",()=>{const show=password.type==="password";password.type=show?"text":"password";eye.textContent=show?"◉":"◌";eye.title=show?"Hide password":"Show password";eye.setAttribute("aria-label",eye.title);password.focus({preventScroll:true})});
fetch("/api/ping",{method:"GET",cache:"no-store",credentials:"same-origin"}).catch(()=>{});
form.addEventListener("submit",async e=>{e.preventDefault();error.textContent="";
const username=document.getElementById("username").value.trim(),pass=password.value;
if(!username||!pass){error.textContent="Enter username and password.";return}
submit.disabled=true;submit.textContent="AUTHENTICATING…";
const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);
try{const response=await fetch("/api/login",{method:"POST",credentials:"include",cache:"no-store",signal:controller.signal,headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({username,password:pass})});clearTimeout(timeout);
const raw=await response.text();let data={};try{data=raw?JSON.parse(raw):{}}catch(_){}
if(!response.ok){error.textContent=data.error||("Login failed ("+response.status+").");submit.disabled=false;submit.textContent="Login →";return}
sessionStorage.removeItem("rover_user");window.location.replace("/index.html");
}catch(err){clearTimeout(timeout);error.textContent=err&&err.name==="AbortError"?"Login request timed out. Try again.":"Unable to contact the control centre. Check your connection.";submit.disabled=false;submit.textContent="Login →"}
});
})();
</script>
</body></html>
