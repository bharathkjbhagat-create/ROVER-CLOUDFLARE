<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DEFENX Device Client</title><meta name="robots" content="noindex">
<style>
:root{--bg:#071018;--card:#0d1924;--line:#1e3444;--text:#e8f2f8;--muted:#7f9aaa;--accent:#22d3a6;--danger:#ff5b65;--warn:#f5b942}
*{box-sizing:border-box}body{margin:0;padding:12px max(12px,env(safe-area-inset-right)) 24px;background:radial-gradient(circle at 20% 0,#10283a 0,#071018 40%);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif}
.card{background:linear-gradient(180deg,#0d1a26,#0a151f);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 auto 10px;max-width:560px}
h1{font-size:16px;margin:0 0 8px;letter-spacing:.08em}input,select{width:100%;margin:4px 0 8px;padding:10px;background:#09131d;color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:16px}
button{background:#122536;border:1px solid #294354;color:var(--text);border-radius:8px;padding:10px 12px;font-weight:700;margin-right:6px}button:disabled{opacity:.5}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;border:1px solid var(--line);font-size:12px;font-weight:700}.ok{color:var(--accent);border-color:var(--accent)}.warn{color:var(--warn);border-color:var(--warn)}.bad{color:var(--danger);border-color:var(--danger)}
.peer{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}pre{white-space:pre-wrap;font-size:11px;color:var(--muted);max-height:160px;overflow:auto;margin:0}small{color:var(--muted)}
</style></head><body>
<div class="card"><h1>DEFENX DEVICE CLIENT</h1><small>Registers this phone as a real device. Create the device in the dashboard (Fleet panel) and paste its ID and one-time secret. The secret stays in this browser tab unless you tick Remember.</small>
<label>Device ID<input id="deviceId" autocomplete="off" autocapitalize="characters" placeholder="PHONE-01"></label>
<label>Device secret<input id="secret" type="password" autocomplete="off" placeholder="64 hex characters"></label>
<label><input id="remember" type="checkbox" style="width:auto"> Remember on this device (stored unencrypted in browser storage)</label>
<button id="startBtn">START</button><button id="stopBtn" disabled>STOP</button> <span id="state" class="pill">STOPPED</span></div>
<div class="card"><small>GPS</small> <b id="gps">waiting…</b><br><small>Queued offline events</small> <b id="queued">0</b>
<div style="margin-top:8px"><select id="facing"><option value="environment">Rear camera</option><option value="user">Front camera</option></select><button id="camBtn">TOGGLE CAMERA STATUS</button> <small id="cam">Camera status: off</small></div></div>
<div class="card"><h1>OTHER DEVICES</h1><div id="peers"><small>—</small></div></div>
<div class="card"><h1>LOG</h1><pre id="log"></pre></div>
<script src="/fleet-protocol.js"></script><script src="/device-client.js"></script></body></html>
