name: DEFENX quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - audit/professional-ui-maintainability

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Rebuild embedded assets
        run: python scripts/build_assets.py
      - name: Validate Python syntax
        run: python -m py_compile src/app.py src/worker.py
      - name: Validate frontend JavaScript syntax
        run: node --check public/app.js
      - name: Run backend smoke tests
        run: uv run --group dev python tests/smoke.py
      - name: Verify required frontend assets
        run: |
          set -eu
          test -f public/index.html
          test -f public/login.html
          test -f public/app.js
          test -f public/style.css
          test -f public/manifest.webmanifest
          test -f public/sw.js
          test -f public/rover-device.webp
          test -f public/rover-left.webp
