name: Import DEFENX ZIP into repository

on:
  push:
    branches: [main]
    paths:
      - ROVER-CLOUDFLARE-DEFENX-implemented.zip
      - .github/workflows/import-defenx-zip.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the supplied DEFENX archive when it is not already in the repository
        shell: bash
        run: |
          set -euo pipefail
          archive="ROVER-CLOUDFLARE-DEFENX-implemented.zip"
          if [ ! -f "$archive" ]; then
            curl -fL --retry 3 --retry-delay 2 "https://drive.usercontent.google.com/download?id=1Mbry_2dNaSiUKBpXwZ44Id1V-f-rwfLn&export=download&confirm=t" -o "$archive"
          fi
          unzip -tq "$archive"

      - name: Extract the uploaded project archive
        shell: bash
        run: |
          set -euo pipefail
          archive="ROVER-CLOUDFLARE-DEFENX-implemented.zip"
          mkdir -p /tmp/defenx-import
          unzip -q "$archive" -d /tmp/defenx-import
          mapfile -t roots < <(find /tmp/defenx-import -mindepth 1 -maxdepth 1 -type d)
          if [ "${#roots[@]}" -eq 1 ] && [ -d "${roots[0]}" ]; then
            source_dir="${roots[0]}"
          else
            source_dir="/tmp/defenx-import"
          fi
          test -f "$source_dir/wrangler.jsonc" || test -f "$source_dir/package.json" || test -f "$source_dir/public/index.html"
          cp -a "$source_dir/." .
          rm -f "$archive"

      - name: Preserve repository-managed GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          git clean -fd .github/workflows
          git restore --source=HEAD --staged --worktree .github/workflows

      - name: Commit imported project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The archive contained no changes."
            exit 0
          fi
          git commit -m "Import complete DEFENX project archive"
          git push
