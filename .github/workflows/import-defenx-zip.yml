name: Import DEFENX ZIP into repository

on:
  push:
    branches: [main]
    paths:
      - ROVER-CLOUDFLARE-DEFENX-implemented.zip

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract the uploaded project archive
        shell: bash
        run: |
          set -euo pipefail
          archive="ROVER-CLOUDFLARE-DEFENX-implemented.zip"
          test -f "$archive"
          mkdir -p /tmp/defenx-import
          unzip -q "$archive" -d /tmp/defenx-import
          mapfile -t roots < <(find /tmp/defenx-import -mindepth 1 -maxdepth 1 -type d)
          if [ "${#roots[@]}" -eq 1 ] && [ -d "${roots[0]}" ]; then
            source_dir="${roots[0]}"
          else
            source_dir="/tmp/defenx-import"
          fi
          test -f "$source_dir/wrangler.jsonc" || test -f "$source_dir/package.json" || test -f "$source_dir/public/index.html"
          cp -a "$source_dir/." .
          rm -f "$archive"

      - name: Commit imported project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The archive contained no changes."
            exit 0
          fi
          git commit -m "Import DEFENX project archive (336 entries)"
          git push
