name: DEFENX Security Regression Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - software-security-audit-fixes

permissions:
  contents: read

jobs:
  software-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Build embedded frontend assets
        run: python scripts/build_assets.py
      - name: Validate Python source
        run: python -m py_compile src/app.py src/worker.py src/biometric_crypto.py
      - name: Validate JavaScript
        run: |
          node --check public/app.js
          node --check public/yolox-browser.js
          node --check public/camera-webrtc.js
          node --check public/dashboard-refinement.js
      - name: Validate browser AI vision JavaScript
        run: |
          node --check public/ai-vision.js
          node --check public/yolox-browser.js
      - name: Test YOLOX output decoding and non-maximum suppression
        run: node --test tests/yolox_browser.test.js
      - name: Validate full-screen monitor JavaScript
        run: node --check public/monitor.js
      - name: Validate face recognition JavaScript
        run: node --check public/face-recognition.js
      - name: Validate face dashboard browser test
        run: node --check tests/face-dashboard-browser.mjs
      - name: Validate dashboard refinement browser test
        run: node --check tests/dashboard-refinement-browser.mjs
      - name: Check frontend performance budget
        run: python scripts/check_performance_budget.py
      - name: Install PlatformIO for firmware compile check
        run: python -m pip install platformio==6.1.18
      - name: Create build-only ESP32 configuration
        run: cp firmware/esp32_rover/config.example.h firmware/esp32_rover/config.h
      - name: Compile ESP32 DevKit firmware
        run: pio run -e esp32dev
      - name: Run backend smoke tests
        run: uv run --group dev python tests/smoke.py
      - name: Run authentication and security regression tests
        run: uv run --group dev python -m unittest discover -s tests -p "test_*.py" -v
