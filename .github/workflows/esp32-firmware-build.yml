name: DEFENX ESP32 firmware build

on:
  pull_request:
    branches: [main]
    paths:
      - "firmware/esp32_rover/**"
      - "platformio.ini"
      - ".github/workflows/esp32-firmware-build.yml"
  push:
    branches: [main]
    paths:
      - "firmware/esp32_rover/**"
      - "platformio.ini"
      - ".github/workflows/esp32-firmware-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Create build-only configuration
        run: cp firmware/esp32_rover/config.example.h firmware/esp32_rover/config.h
      - name: Compile ESP32 DevKit firmware
        run: pio run -e esp32dev
