name: Free production browser audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  # Run only after the production deploy workflow finishes. The job-level
  # condition below prevents audits against an unsuccessful deployment.
  workflow_run:
    workflows: ["Deploy DEFENX to Cloudflare"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: free-production-browser-audit
  cancel-in-progress: true

jobs:
  browser-audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run dashboard refinement browser interaction tests
        if: github.event_name == 'pull_request'
        run: node tests/dashboard-refinement-browser.mjs

      - name: Run read-only production browser checks
        env:
          DEFENX_BASE_URL: https://defenx.bindukjagadish.workers.dev
        run: node tests/production-browser-audit.mjs

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: defenx-browser-audit-failure
          path: artifacts/browser-audit/
          if-no-files-found: ignore
          retention-days: 7
