name: Free production browser audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: free-production-browser-audit
  cancel-in-progress: true

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run read-only production browser checks
        env:
          DEFENX_BASE_URL: https://defenx.bindukjagadish.workers.dev
        run: node tests/production-browser-audit.mjs

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: defenx-browser-audit-failure
          path: artifacts/browser-audit/
          if-no-files-found: ignore
          retention-days: 7
