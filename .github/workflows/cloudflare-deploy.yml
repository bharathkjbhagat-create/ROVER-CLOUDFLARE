# clean Cloudflare-only repository
name: Deploy DEFENX to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/admin-user-list-four-approved-accounts
  workflow_run:
    workflows:
      - Import DEFENX ZIP into repository
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

# Prevent overlapping Worker deployments from racing at the production URL.
concurrency:
  group: defenx-cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      UV_PYTHON: "3.13"
      WORKER_URL: https://defenx.bindukjagadish.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Build embedded WebP assets
        run: python scripts/build_assets.py

      - name: Enforce frontend performance budgets
        run: python scripts/check_performance_budget.py

      - name: Validate Python Worker source
        run: python -m py_compile src/app.py src/worker.py src/biometric_crypto.py
      - name: Validate frontend JavaScript
        run: node --check public/app.js
      - name: Validate camera and dashboard JavaScript
        run: |
          node --check public/phone-camera.js
          node --check public/camera-webrtc.js
          node --check public/phone-gps.js
          node --check public/dashboard-layout.js
      - name: Validate browser AI vision JavaScript
        run: |
          node --check public/vision-core.js
          node --check public/ai-vision.js
      - name: Run vision decision-logic unit tests
        run: node --test tests/vision_core.test.js
      - name: Validate face recognition JavaScript
        run: node --check public/face-recognition.js
      - name: Validate local AI dashboard JavaScript
        run: |
          node --check public/local-vision.js
      - name: Validate detection event history JavaScript
        run: node --check public/detection-events.js
      - name: Validate full-screen monitor JavaScript
        run: node --check public/monitor.js
      - name: Run backend smoke tests
        run: uv run --group dev python tests/smoke.py
      - name: Run authentication, security, and local vision regression tests
        run: uv run --group dev --with fastapi --with httpx --with python-multipart --with opencv-contrib-python-headless --with numpy python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate local AI service Python source
        run: python -m py_compile tools/local_ai_server/ai_server.py tests/test_local_vision_api.py
      - name: Run independent multi-device sync and reconnect integration
        run: uv run --group dev python tests/integration_two_clients.py -v
      - name: Verify required frontend assets
        run: |
          set -e
          test -f public/index.html
          test -f public/monitor.js
          test -f public/vision-core.js
          test -f public/ai-vision.js
          test -f public/face-recognition.js
          test -f public/local-vision.js
          test -f tools/local_ai_server/ai_server.py
          test -f requirements-local-ai.txt
          test -f public/detection-events.js
          test -f public/login.html
          test -f public/app.js
          test -f public/camera-webrtc.js
          test -f public/style.css
          test -f public/manifest.webmanifest
          test -f public/sw.js
          test -f public/rover-device.webp
          test -f public/rover-left.webp
          test -f public/rover-device.svg
          test -f public/rover-device-photo.js
          test -f public/rover-left-photo.js
          test -f public/favicon.svg
          test -f public/robots.txt
          test -f public/sitemap.xml
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Sync Worker secrets
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          ADMIN_USERNAME: ${{ vars.ADMIN_ID || secrets.ADMIN_USERNAME }}
          COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEVICE_OFFLINE_AFTER_SECONDS: ${{ secrets.DEVICE_OFFLINE_AFTER_SECONDS }}
          FACE_DATA_KEY: ${{ secrets.FACE_DATA_KEY }}
          LEGACY_AUTH_ENABLED: ${{ secrets.LEGACY_AUTH_ENABLED }}
          LEGACY_AUTH_URL: ${{ secrets.LEGACY_AUTH_URL }}
          LIVE_SYNC_SECRET: ${{ secrets.LIVE_SYNC_SECRET }}
          ROVER_CAMERA_STREAM_URL: ${{ secrets.ROVER_CAMERA_STREAM_URL }}
          ROVER_CAMERA_STREAM_TYPE: ${{ secrets.ROVER_CAMERA_STREAM_TYPE }}
          ROVER_DEVICE_TOKEN: ${{ secrets.ROVER_DEVICE_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          names = [
              "ADMIN_PASSWORD", "ADMIN_PASSWORD_HASH", "COOKIE_SECURE",
              "DATABASE_URL", "DEVICE_OFFLINE_AFTER_SECONDS", "FACE_DATA_KEY",
              "FRIEND_MAHANTESH_PASSWORD", "FRIEND_MAHANTESH_PASSWORD_HASH",
              "FRIEND_DHANUSH_PASSWORD", "FRIEND_DHANUSH_PASSWORD_HASH",
              "FRIEND_ANIRUDH_PASSWORD", "FRIEND_ANIRUDH_PASSWORD_HASH",
              "FRIEND_MAMALESHWAR_PASSWORD", "FRIEND_MAMALESHWAR_PASSWORD_HASH",
              "FRIEND4_PASSWORD", "FRIEND4_PASSWORD_HASH",
              "LEGACY_AUTH_ENABLED", "LEGACY_AUTH_URL", "LIVE_SYNC_SECRET",
              "ROVER_CAMERA_STREAM_URL", "ROVER_CAMERA_STREAM_TYPE",
              "ROVER_DEVICE_TOKEN", "SESSION_SECRET",
          ]
          payload = {name: os.environ[name] for name in names if os.environ.get(name, "")}
          # Preserve credentials for all four approved user accounts.
          with open("/tmp/defenx-secrets.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          print(f"Prepared {len(names)} supported application secrets; existing account secrets are preserved.")
          PY
          if [ -s /tmp/defenx-secrets.json ] && [ "$(cat /tmp/defenx-secrets.json)" != "{}" ]; then
            uv run pywrangler secret bulk /tmp/defenx-secrets.json
          else
            echo "No new application secrets supplied by GitHub; existing Cloudflare Worker secrets will be preserved."
          fi

      - name: Configure admin username variable
        env:
          ADMIN_USERNAME: ${{ vars.ADMIN_ID || secrets.ADMIN_USERNAME }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("wrangler.jsonc")
          config = json.loads(path.read_text(encoding="utf-8"))
          username = os.environ.get("ADMIN_USERNAME", "").strip()
          if username:
              config.setdefault("vars", {})["ADMIN_USERNAME"] = username
              path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
              print("Configured ADMIN_USERNAME Worker variable.")
          else:
              print("No ADMIN_ID/ADMIN_USERNAME supplied; existing Worker variables will be preserved.")
          PY

      - name: Prepare Cloudflare Python package inputs
        run: |
          # PyWrangler vendors dependencies from pyproject.toml and rejects a
          # root requirements.txt. Keep requirements.txt in Git for standalone
          # Flask installs, but hide it only inside this deployment runner.
          rm -f requirements.txt

      - name: Deploy Worker
        run: uv run pywrangler deploy

      - name: Smoke test Cloudflare Worker
        run: |
          set -euo pipefail
          base="$WORKER_URL"
          check_path() {
            path="$1"
            expected="$2"
            attempts=0
            while [ "$attempts" -lt 10 ]; do
              attempts=$((attempts + 1))
              code="$(curl -A 'Mozilla/5.0 (DEFENX smoke test)' -sS -o /tmp/defenx-response -w '%{http_code}' "$base$path" || true)"
              echo "$path -> HTTP $code (attempt $attempts/10)"
              if [ "$code" = "$expected" ]; then return 0; fi
              if [ "$attempts" -lt 10 ]; then sleep 6; fi
            done
            sed -n '1,60p' /tmp/defenx-response || true
            return 1
          }
          # Root and the normal index must require a session; demo must be explicit.
          check_path / 302
          root_redirect="$(curl -A 'Mozilla/5.0 (DEFENX login-gate smoke test)' -sS -o /dev/null -w '%{redirect_url}' "$base/")"
          case "$root_redirect" in
            "$base/secure-login?ui=20261005"|"$base/login.html")
              echo "Root authentication redirect: PASS ($root_redirect)"
              ;;
            *)
              echo "Root did not redirect to secure login: $root_redirect"
              exit 1
              ;;
          esac
          check_path /index.html 302
          check_path /secure-login 302
          check_path /login.html 200
          check_path /demo 302
          check_path "/index.html?demo=1" 200
          check_path /api/ping 200
          check_path /api/health 200
          check_path /rover-device.webp 200
          check_path /rover-left.webp 200
          health="$(curl -A 'Mozilla/5.0 (DEFENX smoke test)' -sS "$base/api/health")"
          printf '%s\n' "$health" | grep -q '"ok":true'
          printf '%s\n' "$health" | grep -q '"session_configured":true'
          printf '%s\n' "$health" | grep -q '"auth_path_configured":true'
          printf '%s\n' "$health" | grep -q '"realtime_bound":true'
          echo "Public health checks: PASS"
          # Static assets can become visible at different edge locations just after
          # a Worker deployment. Retry the HTTP + content assertion, not only curl.
          fetch_until_marker() {
            label="$1"
            path="$2"
            marker="$3"
            output="$4"
            attempts=0
            while [ "$attempts" -lt 10 ]; do
              attempts=$((attempts + 1))
              code="$(curl --connect-timeout 10 --max-time 25 -A 'Mozilla/5.0 (DEFENX deployment verification)' -sS -o "$output" -w '%{http_code}' "$base$path" || true)"
              if [ "$code" = "200" ] && grep -Fq "$marker" "$output"; then
                echo "$label -> HTTP 200 and expected content found (attempt $attempts/10)"
                return 0
              fi
              echo "$label -> HTTP $code; expected content not ready (attempt $attempts/10)"
              if [ "$attempts" -lt 10 ]; then sleep 3; fi
            done
            echo "ERROR: $label did not return the expected content."
            echo "Response preview:"
            sed -n '1,30p' "$output" || true
            return 1
          }
          fetch_until_marker "Camera WebRTC JavaScript" "/camera-webrtc.js?ci=$GITHUB_RUN_ID" "RTCPeerConnection" "/tmp/defenx-camera-sync.js"
          fetch_until_marker "Dashboard HTML camera loader" "/index.html?demo=1&ci=$GITHUB_RUN_ID" "camera-webrtc.js?v=20261114-online-01" "/tmp/defenx-camera-sync-index.html"
          echo "Deployed WebRTC camera signaling client and dashboard loader: PASS"
          # Explicitly verify the live Worker response never republishes the removed dashboard copy.
          copy_audit_file="/tmp/defenx-removed-copy-audit.html"
          curl --retry 8 --retry-all-errors --retry-delay 2 --retry-max-time 30 -fsS -A 'Mozilla/5.0 (DEFENX removed-copy audit)' "$base/index.html?demo=1&copy_audit=$GITHUB_RUN_ID" -o "$copy_audit_file"
          if grep -Fq 'Browser analysis needs no PC AI service • camera frames and face data stay in the active browser' "$copy_audit_file"; then
            echo "ERROR: removed browser-analysis sentence is still present in the deployed dashboard."
            exit 1
          fi
          if grep -Fq 'UNVERIFIED means face match or live action is pending • follow the on-screen BLINK / TURN / MOUTH prompt • use 2-3 clear, front-facing enrollment photos for better matching • frames stay in this browser' "$copy_audit_file"; then
            echo "ERROR: removed face-verification sentence is still present in the deployed dashboard."
            exit 1
          fi
          if grep -Fq 'Each alert records category, time, status, confidence, camera and GPS (with accuracy, or “unavailable”). No images or face data are stored in alerts; administrators can review them across sessions.' "$copy_audit_file"; then
            echo "ERROR: removed alert-explanation sentence is still present in the deployed dashboard."
            exit 1
          fi
          echo "Removed dashboard copy audit: PASS (all three sentences absent from deployed HTML)"

      - name: Verify deployed online browser vision integration
        run: |
          set -euo pipefail
          base="$WORKER_URL"
          curl --retry 8 --retry-all-errors --retry-delay 2 --retry-max-time 30 -fsS -A 'Mozilla/5.0 (DEFENX online vision integration check)' "$base/index.html?demo=1&ci=$GITHUB_RUN_ID" -o /tmp/defenx-online-vision-index.html
          curl -fsS -A 'Mozilla/5.0 (DEFENX online vision integration check)' "$base/ai-vision.js" -o /tmp/defenx-ai-vision.js
          curl -fsS -A 'Mozilla/5.0 (DEFENX online vision integration check)' "$base/face-recognition.js" -o /tmp/defenx-face-recognition.js
          curl -fsS -A 'Mozilla/5.0 (DEFENX online vision integration check)' "$base/browser-vision-sync.js" -o /tmp/defenx-browser-vision-sync.js
          curl -fsS -A 'Mozilla/5.0 (DEFENX online vision integration check)' "$base/local-vision.js" -o /tmp/defenx-local-vision.js
          grep -Fq 'ONLINE BROWSER AI • OBJECT + FACE' /tmp/defenx-online-vision-index.html
          grep -Fq 'camera-webrtc.js?v=20261114-online-01' /tmp/defenx-online-vision-index.html
          grep -Fq 'browser-vision-sync.js?v=20261115-fix-01' /tmp/defenx-online-vision-index.html
          grep -Fq 'ai-vision.js?v=20261115-face-fast-01' /tmp/defenx-online-vision-index.html
          grep -Fq 'face-recognition.js?v=20261115-face-feedback-01' /tmp/defenx-online-vision-index.html
          grep -Fq 'Start frame analysis now' /tmp/defenx-ai-vision.js
          grep -Fq 'MATCHING FACE' /tmp/defenx-face-recognition.js
          grep -Fq 'ACTION ' /tmp/defenx-face-recognition.js
          grep -Fq 'window.DEFENX_VISION_SYNC.publish(result)' /tmp/defenx-browser-vision-sync.js
          grep -Fq 'defenx-remote-vision-snapshot' /tmp/defenx-local-vision.js
          ! grep -Eq '127\.0\.0\.1:8000|localhost:8000' /tmp/defenx-local-vision.js
          echo "Live online browser vision pipeline and synchronized result renderer: PASS"

      - name: Verify deployed warning controls and JavaScript bindings
        run: |
          set -euo pipefail
          base="$WORKER_URL"
          curl --retry 8 --retry-all-errors --retry-delay 2 --retry-max-time 30 -fsS -A 'Mozilla/5.0 (DEFENX warning-controls live test)' "$base/index.html?demo=1&ci=$GITHUB_RUN_ID" -o /tmp/defenx-live-index.html
          curl -fsS -A 'Mozilla/5.0 (DEFENX warning-controls live test)' "$base/app.js" -o /tmp/defenx-live-app.js
          for id in warningOnBtn warningOffBtn warningToggleBtn; do
            grep -Fq "id=\"$id\"" /tmp/defenx-live-index.html || { echo "Missing deployed warning button: $id"; exit 1; }
            echo "Live HTML button $id: PASS"
          done
          grep -Fq '$("warningOnBtn")?.addEventListener("click"' /tmp/defenx-live-app.js
          grep -Fq '$("warningOffBtn")?.addEventListener("click"' /tmp/defenx-live-app.js
          echo "Live JavaScript ON/OFF handlers: PASS"


      - name: Verify deployed map layers and controls
        run: |
          set -euo pipefail
          base="$WORKER_URL"
          curl --retry 8 --retry-all-errors --retry-delay 2 --retry-max-time 30 -fsS -A 'Mozilla/5.0 (DEFENX map verification)' "$base/index.html?demo=1&ci=$GITHUB_RUN_ID" -o /tmp/defenx-map-index.html
          curl -fsS -A 'Mozilla/5.0 (DEFENX map verification)' "$base/app.js" -o /tmp/defenx-map-app.js
          curl -fsS -A 'Mozilla/5.0 (DEFENX map verification)' "$base/map-enhancements.css" -o /tmp/defenx-map.css
          for id in map mapFollowBtn mapFullscreenBtn mapTileStatus recenterCrossBtn; do
            grep -Fq "id=\"$id\"" /tmp/defenx-map-index.html || { echo "Missing map control: $id"; exit 1; }
          done
          for layer in 'data-mapmode="map"' 'data-mapmode="satellite"' 'data-mapmode="hybrid"'; do
            grep -Fq "$layer" /tmp/defenx-map-index.html || { echo "Missing map layer tab: $layer"; exit 1; }
          done
          grep -Fq 'tile.openstreetmap.org/{z}/{x}/{y}.png' /tmp/defenx-map-app.js
          grep -Fq 'World_Imagery/MapServer/tile/{z}/{y}/{x}' /tmp/defenx-map-app.js
          grep -Fq 'World_Transportation/MapServer/tile/{z}/{y}/{x}' /tmp/defenx-map-app.js
          grep -Fq 'World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}' /tmp/defenx-map-app.js
          grep -Fq 'verifiedRoverFix=d.gps_fix===true&&String(d.gps_source||"")==="ROVER_DEVICE"&&isValidMapPoint(d.lat,d.lon)' /tmp/defenx-map-app.js
          grep -Fq 'router.project-osrm.org/route/v1/driving/' /tmp/defenx-map-app.js
          grep -Fq 'ROAD ROUTE PREVIEW' /tmp/defenx-map-index.html
          grep -Fq '.mapTabs{display:flex!important' /tmp/defenx-map.css
          echo "Deployed map HTML, layer sources, rover GPS validation and responsive controls: PASS"

      - name: Verify deployed login endpoint rejects bad credentials cleanly
        run: |
          set -euo pipefail
          base="$WORKER_URL"
          code="$(curl -A 'Mozilla/5.0 (DEFENX auth smoke test)' -sS -o /tmp/defenx-login-response -w '%{http_code}' -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"username":"__INVALID_TEST_USER__","password":"__INVALID_TEST_PASSWORD__"}' "$base/api/login")"
          echo "/api/login invalid credentials -> HTTP $code"
          test "$code" = "401"
          python - <<'PY'
          import json
          with open("/tmp/defenx-login-response", encoding="utf-8") as handle:
              data = json.load(handle)
          assert data.get("ok") is False, data
          PY

          code="$(curl -A 'Mozilla/5.0 (DEFENX auth smoke test)' -sS -o /tmp/defenx-incomplete-login-response -w '%{http_code}' -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"username":"","password":""}' "$base/api/login")"
          echo "/api/login incomplete credentials -> HTTP $code"
          test "$code" = "400"
          python - <<'PY'
          import json
          with open("/tmp/defenx-incomplete-login-response", encoding="utf-8") as handle:
              data = json.load(handle)
          assert data.get("ok") is False, data
          PY

          code="$(curl -A 'Mozilla/5.0 (DEFENX auth smoke test)' -sS -o /tmp/defenx-me-response -w '%{http_code}' "$base/api/me")"
          echo "/api/me without session -> HTTP $code"
          test "$code" = "401"
          # Regression: a recognized account with a deliberately random wrong
          # password must return 401, not trigger an unhandled Worker 500.
          wrong_password="$(python -c 'import secrets; print("invalid-test-" + secrets.token_urlsafe(24))')"
          export WRONG_PASSWORD="$wrong_password"
          payload="$(python -c 'import json,os; print(json.dumps({"username":"DHANUSH","password":os.environ["WRONG_PASSWORD"]}))')"
          code="$(curl -A 'Mozilla/5.0 (DEFENX known-user auth test)' -sS -o /tmp/defenx-known-user-response -w '%{http_code}' -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$payload" "$base/api/login")"
          echo "/api/login recognized username + wrong password -> HTTP $code"
          if [ "$code" != "401" ]; then
            echo "Unexpected response body from recognized-user login regression:"
            sed -n '1,80p' /tmp/defenx-known-user-response || true
            echo "Cloudflare app diagnostics:"
            curl -A 'Mozilla/5.0 (DEFENX known-user diagnostic)' -sS "$base/api/health" || true
            echo
            exit 1
          fi
          python - <<'PY'
          import json
          with open("/tmp/defenx-known-user-response", encoding="utf-8") as handle:
              data = json.load(handle)
          assert data.get("ok") is False, data
          PY
          echo "Recognized-user invalid-password regression: PASS"
          echo "Login contract checks: PASS"

      - name: Verify deployed admin login and session when credential is available
        env:
          ADMIN_USERNAME: ${{ vars.ADMIN_ID || secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          FACE_DATA_KEY: ${{ secrets.FACE_DATA_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_PASSWORD:-}" ]; then
            echo "ADMIN_PASSWORD is not stored in GitHub; skipping valid-login check and relying on deployed health/session configuration checks."
            exit 0
          fi
          base="$WORKER_URL"
          payload="$(python -c 'import json,os; print(json.dumps({"username":os.environ.get("ADMIN_USERNAME") or "ROVERADMIN","password":os.environ["ADMIN_PASSWORD"]}))')"
          code="$(curl -A 'Mozilla/5.0 (DEFENX valid-login smoke test)' -sS -o /tmp/defenx-valid-login.json -c /tmp/defenx-cookies.txt -w '%{http_code}' -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$payload" "$base/api/login")"
          echo "/api/login valid credentials -> HTTP $code"
          test "$code" = "200"
          python - <<'PY'
          import json
          with open("/tmp/defenx-valid-login.json", encoding="utf-8") as handle:
              data = json.load(handle)
          assert data.get("ok") is True, data
          PY
          me_code="$(curl -A 'Mozilla/5.0 (DEFENX session smoke test)' -sS -o /tmp/defenx-valid-me.json -w '%{http_code}' -b /tmp/defenx-cookies.txt "$base/api/me")"
          echo "/api/me with session -> HTTP $me_code"
          test "$me_code" = "200"
          python - <<'PY'
          import json
          with open("/tmp/defenx-valid-me.json", encoding="utf-8") as handle:
              data = json.load(handle)
          assert data.get("ok") is True, data
          PY
          echo "Valid-login/session checks: PASS"
          users_code="$(curl -A 'Mozilla/5.0 (DEFENX admin user-list check)' -sS -o /tmp/defenx-admin-users.json -w '%{http_code}' -b /tmp/defenx-cookies.txt "$base/api/users")"
          echo "/api/users with admin session -> HTTP $users_code"
          test "$users_code" = "200"
          python - <<'PY'
          import json
          expected = {"MAHANTESH", "DHANUSH", "ANIRUDH", "MAMALESHWAR"}
          with open("/tmp/defenx-admin-users.json", encoding="utf-8") as handle:
              data = json.load(handle)
          assert data.get("ok") is True, data
          assert data.get("db_connected") is True, f"Admin user list is not backed by Neon: {data}"
          names = {str(row.get("username", "")).strip().upper() for row in data.get("users", [])}
          missing = sorted(expected - names)
          assert not missing, f"Admin user list is missing approved accounts: {missing}; returned: {sorted(names)}"
          pending = sorted(str(row.get("username", "")) for row in data.get("users", []) if row.get("database_pending"))
          assert not pending, f"Approved accounts are placeholders, not persisted in Neon: {pending}"
          print("Admin user list contains all four approved accounts persisted in Neon: PASS")
          PY
          db_code="$(curl -A 'Mozilla/5.0 (DEFENX read-only PostgreSQL check)' -sS -o /tmp/defenx-database-check.json -w '%{http_code}' -b /tmp/defenx-cookies.txt "$base/api/admin/database-check")"
          echo "/api/admin/database-check -> HTTP $db_code"
          if [ "$db_code" != "200" ]; then
            cat /tmp/defenx-database-check.json
            exit 1
          fi
          python - <<'PY'
          import json
          with open("/tmp/defenx-database-check.json", encoding="utf-8") as handle:
              data = json.load(handle)
          assert data.get("ok") is True, data
          assert data.get("database") == "connected", data
          assert data.get("test") == "SELECT 1", data
          assert data.get("connection_path") in {"hyperdrive", "database_url"}, data
          PY
          echo "Read-only PostgreSQL connectivity check: PASS"
