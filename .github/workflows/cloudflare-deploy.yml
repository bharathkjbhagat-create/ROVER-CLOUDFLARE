# clean Cloudflare-only repository
name: Deploy DEFENX to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Validate Python Worker source
        run: python -m py_compile src/app.py src/worker.py
      - name: Validate frontend JavaScript
        run: node --check public/app.js
      - name: Run backend smoke tests
        run: uv run --group dev python tests/smoke.py
      - name: Verify required frontend assets
        run: |
          set -e
          test -f public/index.html
          test -f public/login.html
          test -f public/app.js
          test -f public/style.css
          test -f public/manifest.webmanifest
          test -f public/sw.js
          test -f public/rover-device.webp
          test -f public/rover-left.webp
          test -f public/favicon.svg
          test -f public/robots.txt
          test -f public/sitemap.xml
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Sync optional Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          FRIEND_MAHANTESH_PASSWORD: ${{ secrets.FRIEND_MAHANTESH_PASSWORD }}
          FRIEND_DHANUSH_PASSWORD: ${{ secrets.FRIEND_DHANUSH_PASSWORD }}
          FRIEND_ANIRUDH_PASSWORD: ${{ secrets.FRIEND_ANIRUDH_PASSWORD }}
          FRIEND4_PASSWORD: ${{ secrets.FRIEND4_PASSWORD }}
          ROVER_DEVICE_TOKEN: ${{ secrets.ROVER_DEVICE_TOKEN }}
          ROVER_CAMERA_STREAM_URL: ${{ secrets.ROVER_CAMERA_STREAM_URL }}
          ROVER_CAMERA_STREAM_TYPE: ${{ secrets.ROVER_CAMERA_STREAM_TYPE }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          LIVE_SYNC_SECRET: ${{ secrets.LIVE_SYNC_SECRET }}
          CLOUDFLARE_FALLBACK_SEED: ${{ secrets.ROVER_DEVICE_TOKEN }}
          COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}
        run: |
          set -e
          put_secret() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | uv run pywrangler secret put "$name" --remote
            fi
          }
          put_secret ADMIN_PASSWORD "$ADMIN_PASSWORD"
          put_secret FRIEND_MAHANTESH_PASSWORD "$FRIEND_MAHANTESH_PASSWORD"
          put_secret FRIEND_DHANUSH_PASSWORD "$FRIEND_DHANUSH_PASSWORD"
          put_secret FRIEND_ANIRUDH_PASSWORD "$FRIEND_ANIRUDH_PASSWORD"
          put_secret FRIEND4_PASSWORD "$FRIEND4_PASSWORD"
          put_secret ROVER_DEVICE_TOKEN "$ROVER_DEVICE_TOKEN"
          put_secret ROVER_CAMERA_STREAM_URL "$ROVER_CAMERA_STREAM_URL"
          put_secret ROVER_CAMERA_STREAM_TYPE "$ROVER_CAMERA_STREAM_TYPE"
          session_value="$SESSION_SECRET"
          if [ -z "$session_value" ]; then session_value="$CLOUDFLARE_FALLBACK_SEED"; fi
          if [ -z "$session_value" ]; then session_value="$ADMIN_PASSWORD"; fi
          test -n "$session_value" || { echo "No session secret seed available; configure SESSION_SECRET or ROVER_DEVICE_TOKEN."; exit 1; }
          put_secret SESSION_SECRET "$session_value"
          if [ -n "$ADMIN_USERNAME" ]; then put_secret ADMIN_USERNAME "$ADMIN_USERNAME"; fi
          put_secret LIVE_SYNC_SECRET "$LIVE_SYNC_SECRET"
          put_secret COOKIE_SECURE "$COOKIE_SECURE"
      - name: Verify application authentication secrets
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ROVER_DEVICE_TOKEN: ${{ secrets.ROVER_DEVICE_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$SESSION_SECRET" ] && [ -z "$ROVER_DEVICE_TOKEN" ] && [ -z "$ADMIN_PASSWORD" ]; then
            echo "Missing authentication secret seed: configure SESSION_SECRET, ROVER_DEVICE_TOKEN, or ADMIN_PASSWORD."
            exit 1
          fi
          test -n "$ADMIN_PASSWORD" || { echo "Missing GitHub Actions secret: ADMIN_PASSWORD"; exit 1; }
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler deploy
      - name: Smoke test Cloudflare Worker
        run: |
          set -e
          base="https://defenx.bindukjagadish.workers.dev"
          check_path() {
            path="$1"
            expected="$2"
            attempts=0
            while [ "$attempts" -lt 10 ]; do
              attempts=$((attempts + 1))
              code="$(curl -A 'Mozilla/5.0 (DEFENX smoke test)' -sS -o /tmp/defenx-response -w '%{http_code}' "$base$path" || true)"
              echo "$path -> HTTP $code (attempt $attempts/10)"
              if [ "$code" = "$expected" ]; then return 0; fi
              if [ "$attempts" -lt 10 ]; then sleep 6; fi
            done
            sed -n '1,60p' /tmp/defenx-response || true
            return 1
          }
          check_path /login.html 200
          check_path /api/ping 200
          check_path /api/health 200
          check_path /rover-device.webp 200
          check_path /rover-left.webp 200
          health="$(curl -A 'Mozilla/5.0 (DEFENX smoke test)' -sS "$base/api/health")"
          echo "$health"
          printf '%s' "$health" | grep -q '"ok":true'
          printf '%s' "$health" | grep -q '"session_configured":true'
          printf '%s' "$health" | grep -q '"auth_path_configured":true'
          printf '%s' "$health" | grep -q '"realtime_bound":true'

      - name: Verify deployed login endpoint
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -e
          base="https://defenx.bindukjagadish.workers.dev"
          jar="$(mktemp)"
          payload="$(python -c 'import json,os; print(json.dumps({"username":os.environ["ADMIN_USERNAME"],"password":os.environ["ADMIN_PASSWORD"]}))')"
          code="$(curl -A 'Mozilla/5.0 (DEFENX auth smoke test)' -sS -o /tmp/defenx-login-response -w '%{http_code}' -c "$jar" -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$payload" "$base/api/login")"
          echo "/api/login -> HTTP $code"
          cat /tmp/defenx-login-response
          test "$code" = "200"
          python -c 'import json; d=json.load(open("/tmp/defenx-login-response",encoding="utf-8")); assert d.get("ok") is True, d; assert isinstance(d.get("user"), dict), d'
          code="$(curl -A 'Mozilla/5.0 (DEFENX auth smoke test)' -sS -o /tmp/defenx-me-response -w '%{http_code}' -b "$jar" "$base/api/me")"
          echo "/api/me -> HTTP $code"
          cat /tmp/defenx-me-response
          test "$code" = "200"
